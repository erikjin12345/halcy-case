# Pull request checks. Kept to what the case can be disqualified on:
# the code compiles and the tests pass. The payment-boundary audit is
# planned as a third job once the hand-off code exists (agent/payment/).
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: halcy_case_material
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: halcy_case_material/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

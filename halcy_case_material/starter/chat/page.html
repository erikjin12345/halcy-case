<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Chat</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #e9e9e9; font: 15px/1.4 system-ui, -apple-system, sans-serif; color: #181818; }
      .phone { max-width: 420px; height: 100vh; height: 100dvh; margin: 0 auto; background: #fafafa; display: flex; flex-direction: column; }
      header { padding: 14px 16px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
      header strong { font-weight: 600; }
      header button { font: inherit; font-size: 13px; background: none; border: 0; color: #5c5c5c; cursor: pointer; }
      #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      /* Keep messages and cards at their full height; with overflow: hidden a card would otherwise shrink and cut its text and buttons. */
      #log > * { flex-shrink: 0; }
      .msg { max-width: 82%; padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
      .agent { align-self: flex-start; background: #fff; border: 1px solid #e3e3e3; }
      .traveller { align-self: flex-end; background: #181818; color: #fff; }
      .time { font-size: 11px; color: #8a8a8a; margin-top: -6px; }
      .time.agent, .time.card-time { align-self: flex-start; padding-left: 4px; }
      .time.traveller { align-self: flex-end; padding-right: 4px; background: none; color: #8a8a8a; }
      .card { align-self: flex-start; width: 88%; background: #fff; border: 1px solid #d6d6d6; border-radius: 14px; overflow: hidden; }
      .card img { display: block; width: 100%; border-bottom: 1px solid #eee; }
      .card .body { padding: 12px 14px; }
      .card .title { font-weight: 600; margin-bottom: 4px; }
      .card .line { color: #444; }
      .card a { display: inline-block; margin-top: 8px; color: #181818; }
      .card .buttons { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 14px; }
      .card button { font: inherit; padding: 9px 14px; border-radius: 999px; border: 1px solid #181818; background: #fff; cursor: pointer; }
      .card button.primary { background: #181818; color: #fff; }
      .card button:disabled { opacity: 0.4; cursor: default; }
      .card button.chosen { opacity: 1; outline: 2px solid #181818; outline-offset: 2px; }
      /* The trace: how the agent worked. Not part of the conversation: grey, small, folded away. */
      .trace { align-self: stretch; font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; color: #8a8a8a; border-left: 2px solid #e0e0e0; padding: 2px 0 2px 8px; }
      .trace > summary { cursor: pointer; list-style: none; user-select: none; }
      .trace > summary::before { content: "▸ "; }
      .trace[open] > summary::before { content: "▾ "; }
      .trace ol { list-style: none; margin: 4px 0 0; padding: 0; }
      .trace li { margin: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .trace li details > summary { cursor: pointer; list-style: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .trace li .detail { white-space: pre-wrap; padding: 2px 0 4px 12px; color: #9a9a9a; }
      .trace .who { color: #a0a0a0; }
      /* Test mode only (?test=1): marked lines and the case sidebar. */
      .trace li.trap { color: #2f6b3a; }
      .trace li.trap.hit { color: #a3342b; }
      .trace li.decision { color: #2f4f7a; }
      .trace li.checks { color: #181818; font-weight: 600; }
      #cases-toggle { display: none; }
      body.test #cases-toggle { display: inline; }
      #cases { position: fixed; top: 0; left: 0; bottom: 0; width: 340px; max-width: 90vw; overflow-y: auto; background: #fff; border-right: 1px solid #ccc; padding: 12px; font-size: 13px; transform: translateX(-100%); transition: transform 0.15s; z-index: 10; }
      #cases.open { transform: none; }
      #cases h3 { font-size: 13px; margin: 14px 0 6px; }
      #cases .case { border: 1px solid #e3e3e3; border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; }
      #cases .case .t { font-weight: 600; margin-bottom: 4px; }
      #cases .paste { display: block; width: 100%; text-align: left; font: inherit; background: #f4f4f4; border: 0; border-radius: 6px; padding: 4px 6px; margin: 2px 0; cursor: pointer; }
      #busy { padding: 0 16px 6px; color: #5c5c5c; font-size: 13px; min-height: 20px; }
      #examples { display: flex; gap: 6px; overflow-x: auto; padding: 0 12px 8px; }
      #examples button { flex: 0 0 auto; max-width: 260px; font: inherit; font-size: 13px; text-align: left; padding: 7px 11px; border-radius: 12px; border: 1px solid #d6d6d6; background: #fff; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid #ddd; }
      textarea { flex: 1; font: inherit; padding: 10px 12px; border-radius: 18px; border: 1px solid #ccc; resize: none; height: 42px; }
      form button { font: inherit; padding: 0 16px; border-radius: 18px; border: 0; background: #181818; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="phone">
      <header><span><button id="cases-toggle" title="Test cases to paste">Cases</button> <strong>Halcy</strong></span><span><button id="mode" title="Switch between the normal chat and test mode">Test mode</button> <button id="reset" title="Clear the conversation">Clear</button></span></header>
      <div id="log" aria-live="polite"></div>
      <div id="busy"></div>
      <div id="examples"></div>
      <form id="form"><textarea id="text" placeholder="Message" rows="1"></textarea><button>Send</button></form>
    </div>
    <aside id="cases" aria-label="Test cases"></aside>
    <script>
      // Test mode: ?test=1. The normal chat is unchanged without it.
      const TEST = new URLSearchParams(location.search).get("test") === "1";
      if (TEST) document.body.classList.add("test");
      // One click switches mode by reloading with or without ?test=1; the conversation is kept by the server.
      const mode = document.getElementById("mode");
      mode.textContent = TEST ? "Normal mode" : "Test mode";
      mode.onclick = () => {
        const url = new URL(location.href);
        if (TEST) url.searchParams.delete("test");
        else url.searchParams.set("test", "1");
        location.href = url.toString();
      };
      const log = document.getElementById("log");
      const cards = new Map();
      const post = (path, body) =>
        fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body ?? {}) });
      const scroll = () => (log.scrollTop = log.scrollHeight);

      const clock = (at) => new Date(at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      function stamp(at, side) {
        if (!at) return;
        const t = document.createElement("div");
        t.className = "time " + side;
        t.textContent = clock(at);
        log.appendChild(t);
      }

      function message(from, text, at) {
        const el = document.createElement("div");
        el.className = "msg " + from;
        el.textContent = text;
        log.appendChild(el);
        stamp(at, from);
      }

      function card(id, c, at) {
        const el = document.createElement("div");
        el.className = "card";
        if (c.image) {
          const img = document.createElement("img");
          img.src = c.image;
          img.alt = "";
          el.appendChild(img);
        }
        const body = document.createElement("div");
        body.className = "body";
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = c.title;
        body.appendChild(title);
        for (const l of c.lines ?? []) {
          const line = document.createElement("div");
          line.className = "line";
          line.textContent = l;
          body.appendChild(line);
        }
        if (c.link) {
          const a = document.createElement("a");
          a.href = c.link.url;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = c.link.label;
          body.appendChild(a);
        }
        el.appendChild(body);
        if (c.buttons?.length) {
          const row = document.createElement("div");
          row.className = "buttons";
          c.buttons.forEach((b, i) => {
            const btn = document.createElement("button");
            btn.textContent = b.label;
            btn.dataset.id = b.id;
            if (i === 0) btn.className = "primary";
            btn.onclick = () => post("/press", { card: id, button: b.id });
            row.appendChild(btn);
          });
          el.appendChild(row);
        }
        cards.set(id, el);
        log.appendChild(el);
        stamp(at, "card-time");
      }

      function pressed(id, button) {
        const el = cards.get(id);
        if (!el) return;
        for (const b of el.querySelectorAll("button")) {
          b.disabled = true;
          if (b.dataset.id === button) b.classList.add("chosen");
        }
      }

      // Trace blocks sit in the conversation where the work happened: a step goes into
      // the block at the bottom, and a new block starts below any message or card that
      // came after it, so each piece of work stays under what it answered.
      let trace = null;
      function traceRun() {
        trace = document.createElement("details");
        trace.className = "trace";
        trace.innerHTML = "<summary></summary><ol></ol>";
        trace.count = 0;
        if (TEST) trace.open = true;
        traceTitle();
        log.appendChild(trace);
      }
      function traceTitle() {
        trace.querySelector("summary").textContent = `How Halcy worked on this · ${trace.count} step${trace.count === 1 ? "" : "s"}`;
      }
      function traceStep(s) {
        if (!trace || !trace.isConnected || log.lastElementChild !== trace) traceRun();
        const li = document.createElement("li");
        if (s.kind) li.className = s.kind + (s.kind === "trap" && s.text.startsWith("NOT avoided") ? " hit" : "");
        const head = `${s.at ? clock(s.at) + "  " : ""}`;
        const line = (el) => {
          const who = document.createElement("span");
          who.className = "who";
          who.textContent = `${head}${s.who}: `;
          el.append(who, document.createTextNode(s.text));
        };
        if (s.detail) {
          const d = document.createElement("details");
          const sum = document.createElement("summary");
          line(sum);
          const body = document.createElement("div");
          body.className = "detail";
          body.textContent = s.detail;
          d.append(sum, body);
          li.appendChild(d);
        } else line(li);
        trace.querySelector("ol").appendChild(li);
        trace.count++;
        traceTitle();
      }

      const events = new EventSource(TEST ? "/events?test=1" : "/events");
      events.onmessage = (m) => {
        const e = JSON.parse(m.data);
        if (e.type === "message") message(e.from, e.text, e.at);
        if (e.type === "card") card(e.id, e.card, e.at);
        if (e.type === "pressed") pressed(e.card, e.button);
        if (e.type === "busy") document.getElementById("busy").textContent = e.on ? "Halcy is working…" : "";
        if (e.type === "trace.run") traceRun();
        if (e.type === "trace") traceStep(e.step);
        if (e.type === "reset") { log.innerHTML = ""; cards.clear(); trace = null; }
        scroll();
      };

      const text = document.getElementById("text");
      function send() {
        const t = text.value.trim();
        if (!t) return;
        text.value = "";
        post("/send", { text: t });
      }
      document.getElementById("form").onsubmit = (e) => { e.preventDefault(); send(); };
      text.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
      document.getElementById("reset").onclick = () => post("/reset");

      if (TEST) {
        const panel = document.getElementById("cases");
        document.getElementById("cases-toggle").onclick = () => panel.classList.toggle("open");
        fetch("/cases").then((r) => r.json()).then((groups) => {
          for (const g of groups) {
            const h = document.createElement("h3");
            h.textContent = g.hotel;
            panel.appendChild(h);
            for (const c of g.cases) {
              const box = document.createElement("div");
              box.className = "case";
              const t = document.createElement("div");
              t.className = "t";
              t.textContent = c.id + (c.title ? " · " + c.title : "");
              box.appendChild(t);
              for (const line of [c.message, ...c.replies]) {
                const b = document.createElement("button");
                b.className = "paste";
                b.textContent = line;
                b.title = "Put this in the message box";
                b.onclick = () => { text.value = line.replace(/^\(press\) /, ""); text.focus(); };
                box.appendChild(b);
              }
              panel.appendChild(box);
            }
          }
        });
      }

      fetch("/examples").then((r) => r.json()).then((list) => {
        const box = document.getElementById("examples");
        for (const ex of list) {
          const b = document.createElement("button");
          b.textContent = ex;
          b.title = ex;
          b.onclick = () => { text.value = ex; text.focus(); };
          box.appendChild(b);
        }
      });
    </script>
  </body>
</html>
